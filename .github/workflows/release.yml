name: Release

# Push a tag (e.g. `git tag v10.0 && git push origin v10.0`) to build the addon zip and
# attach it to a GitHub release. To also upload to CurseForge / Wago, add
# `## X-Curse-Project-ID:` / `## X-Wago-ID:` to ArtPad.toc and the CF_API_KEY /
# WAGO_API_TOKEN repository secrets.

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before packaging
        run: |
          pip install lupa
          python tests/run_tests.py
      - name: Package and upload
        uses: BigWigsMods/packager@v2
