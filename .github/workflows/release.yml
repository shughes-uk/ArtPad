name: Release

# Push a tag (e.g. `git tag v10.0_release && git push origin v10.0_release`) to build the
# addon zip and attach it to a GitHub release.
#
# This workflow only ever makes GitHub releases. CurseForge builds come from the
# CurseForge project's own repository webhook (pushes become alphas, tags become
# releases), so uploading from here too would create duplicate files. That's why no
# CurseForge / Wago / WoWInterface tokens are passed, and the project ids are unset.

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before packaging
        run: |
          pip install lupa
          python tests/run_tests.py
      - name: Package for GitHub release
        uses: BigWigsMods/packager@v2
        with:
          # -p 0 / -w 0 / -a 0: never upload to CurseForge, WoWInterface or Wago
          args: -p 0 -w 0 -a 0
